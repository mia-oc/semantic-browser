                - generic "English pronunciation respelling" [ref=e392]: EYE-fəl
              - text: ;
              - link "French" [ref=e393] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/French_language
              - text: ": Tour Eiffel"
              - link "[tuʁ ɛfɛl]" [ref=e395] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Help:IPA/French
              - generic [ref=e396]:
                - button "Play audio" [ref=e398] [cursor=pointer]
                - superscript [ref=e400]:
                  - link "ⓘ" [ref=e401] [cursor=pointer]:
                    - /url: /wiki/File:Tour_Eiffel_Pronunciation.ogg
              - text: ) is a
              - link "lattice tower" [ref=e402] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Lattice_tower
              - text: on the
              - link "Champ de Mars" [ref=e403] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Champ_de_Mars
              - text: in
              - link "Paris" [ref=e404] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Paris
              - text: ", France. It is named after the engineer"
              - link "Gustave Eiffel" [ref=e405] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Gustave_Eiffel
              - text: ", whose company designed and built the tower from 1887 to 1889."
            - paragraph [ref=e406]:
              - text: Locally nicknamed "La dame de fer" (French for "Iron Lady") for its use of
              - link "wrought iron" [ref=e407] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Wrought_iron
              - text: ", it was constructed as the centrepiece of the"
              - link "1889 World's Fair" [ref=e408] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Exposition_Universelle_(1889)
              - text: ", and to crown the centennial anniversary of the"
              - link "French Revolution" [ref=e409] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/French_Revolution
              - text: . Although initially criticised by some of France's leading artists and intellectuals for its design, it has since become a global
              - link "cultural icon" [ref=e410] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Cultural_icon
              - text: of France and one of the most recognisable structures in the world.
              - superscript [ref=e411]:
                - link "[5]" [ref=e412] [cursor=pointer]:
                  - /url: "#cite_note-Key_figures-5"
              - text: The tower received 5,889,000 visitors in 2022.
              - superscript [ref=e414]:
                - link "[6]" [ref=e415] [cursor=pointer]:
                  - /url: "#cite_note-6"
              - text: "The Eiffel Tower is the most visited monument with an entrance fee in the world:"
              - superscript [ref=e417]:
                - link "[7]" [ref=e418] [cursor=pointer]:
                  - /url: "#cite_note-:0-7"
              - text: 6.91 million people ascended it in 2015. It was designated a
              - generic "French-language text" [ref=e420]:
                - link "monument historique" [ref=e422] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Monument_historique
              - text: in 1964, and was named part of a
              - link "UNESCO World Heritage Site" [ref=e423] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/UNESCO_World_Heritage_Site
              - text: ("Paris, Banks of the Seine") in 1991.
              - superscript [ref=e424]:
                - link "[8]" [ref=e425] [cursor=pointer]:
                  - /url: "#cite_note-8"
            - paragraph [ref=e427]:
              - text: The tower is 330 metres (1,083 ft) tall,
              - superscript [ref=e428]:
                - link "[9]" [ref=e429] [cursor=pointer]:
                  - /url: "#cite_note-9"
              - text: about the same height as an 81-storey building, and the
              - link "tallest structure in Paris" [ref=e431] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/List_of_tallest_buildings_and_structures_in_the_Paris_region
              - text: . Its base is square, measuring 125 metres (410 ft) on each side. During its construction, the Eiffel Tower surpassed the
              - link "Washington Monument" [ref=e432] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Washington_Monument
              - text: to become by far the
              - link "tallest human-made structure" [ref=e433] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/List_of_tallest_freestanding_structures_in_the_world#Timeline_of_world's_tallest_freestanding_structures
              - text: in the world, a title it held for 41 years until the
              - link "Chrysler Building" [ref=e434] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Chrysler_Building
              - text: in New York City was finished in 1930. It was the first structure in the world to surpass both the 200-metre and 300-metre mark in height. Due to the addition of a broadcasting
              - link "aerial" [ref=e435] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Aerial_(radio)
              - text: at the top of the tower in 1957, it is now taller than the Chrysler Building by 11 metres (36 ft). Excluding transmitters, the Eiffel Tower is the
              - link "second tallest free-standing structure in France" [ref=e436] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/List_of_tallest_structures_in_France
              - text: after the
              - link "Millau Viaduct" [ref=e437] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Millau_Viaduct
              - text: .
            - paragraph [ref=e438]:
              - text: The tower has three levels for visitors, with restaurants on the first and second levels. The top level's upper platform is 276 m (906 ft) above the ground—the highest public
              - link "observation deck" [ref=e439] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Observation_deck
              - text: in the
              - link "European Union" [ref=e440] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/European_Union
              - text: . Tickets can be purchased to ascend by stairs or
              - link "lift" [ref=e441] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Elevator
              - text: to the first and second levels. The climb from ground level to the first level is over 300 steps, as is the climb from the first level to the second, making the entire ascent a 600-step climb. Although there is a staircase to the top level, it is usually accessible only by lift. On this top, third level, is a private apartment built for Gustave Eiffel, who decorated it with furniture made by Jean Lachaise and invited friends such as
              - link "Thomas Edison" [ref=e442] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Thomas_Edison
              - text: .
          - region [ref=e443]:
            - heading "History" [level=2] [ref=e445]
            - region [ref=e446]:
              - heading "Origin" [level=3] [ref=e448]
              - paragraph [ref=e449]:
                - text: The design of the Eiffel Tower is attributed to
                - link "Maurice Koechlin" [ref=e450] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Maurice_Koechlin
                - text: and
                - link "Émile Nouguier" [ref=e451] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Émile_Nouguier
                - text: ", two senior engineers working for the"
                - link "Compagnie des Établissements Eiffel" [ref=e452] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Gustave_Eiffel
                - text: . It was envisaged after discussion about a suitable centrepiece for the proposed
                - link "1889 Exposition Universelle" [ref=e453] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Exposition_Universelle_(1889)
                - text: ", a"
                - link "world's fair" [ref=e454] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/World's_fair
                - text: to celebrate the centennial of the
                - link "French Revolution" [ref=e455] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/French_Revolution
                - text: . In May 1884, working at home, Koechlin made a sketch of their idea, described by him as "a great pylon, consisting of four lattice girders standing apart at the base and coming together at the top, joined together by metal
                - link "trusses" [ref=e456] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Truss
                - text: at regular intervals".
                - superscript [ref=e457]:
                  - link "[10]" [ref=e458] [cursor=pointer]:
                    - /url: "#cite_note-10"
                - text: Eiffel initially showed little enthusiasm, but he did approve further study, and the two engineers then asked
                - link "Stephen Sauvestre" [ref=e460] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Stephen_Sauvestre
                - text: ", the head of the company's architectural department, to contribute to the design. Sauvestre added decorative arches to the base of the tower, a glass pavilion to the first level, and other embellishments."
                - superscript [ref=e461]:
                  - text: "["
                  - link "citation needed" [ref=e463] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Wikipedia:Citation_needed
                  - text: "]"
              - figure [ref=e464]:
                - link [ref=e465] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Maurice_koechlin_pylone.jpg
                - generic [ref=e467]:
                  - text: First drawing of the Eiffel Tower by Maurice Koechlin including size comparison with other Parisian landmarks such as
                  - link "Notre Dame de Paris" [ref=e468] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Notre_Dame_de_Paris
                  - text: ", the"
                  - link "Statue of Liberty" [ref=e469] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Île_aux_Cygnes#Statue_of_Liberty_replica
                  - text: ", and the"
                  - link "Vendôme Column" [ref=e470] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Vendôme_Column
              - paragraph [ref=e471]:
                - text: "The new version gained Eiffel's support: he bought the rights to the patent on the design which Koechlin, Nouguier, and Sauvestre had taken out, and the design was put on display at the Exhibition of Decorative Arts in the autumn of 1884 under the company name. On 30 March 1885, Eiffel presented his plans to the"
                - generic "French-language text" [ref=e472]: Société des Ingénieurs Civils
                - text: ; after discussing the technical problems and emphasising the practical uses of the tower, he finished his talk by saying the tower would symbolise
              - blockquote [ref=e473]:
                - paragraph [ref=e474]:
                  - text: "[n]ot only the art of the modern engineer, but also the century of Industry and Science in which we are living, and for which the way was prepared by the great scientific movement of the eighteenth century and by the Revolution of 1789, to which this monument will be built as an expression of France's gratitude."
                  - superscript [ref=e475]:
                    - link "[11]" [ref=e476] [cursor=pointer]:
                      - /url: "#cite_note-loyrette116-11"
              - paragraph [ref=e478]:
                - text: Little progress was made until 1886, when
                - link "Jules Grévy" [ref=e479] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Jules_Grévy
                - text: was re-elected as president of France and
                - link "Édouard Lockroy" [ref=e480] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Édouard_Lockroy
                - text: was appointed as minister for trade. A budget for the exposition was passed and, on 1 May, Lockroy announced an alteration to the terms of the open competition being held for a centrepiece to the exposition, which effectively made the selection of Eiffel's design a foregone conclusion, as entries had to include a study for a 300 m (980 ft) four-sided metal tower on the Champ de Mars.
                - superscript [ref=e481]:
                  - link "[11]" [ref=e482] [cursor=pointer]:
                    - /url: "#cite_note-loyrette116-11"
                - text: (A 300-metre tower was then considered a herculean engineering effort.) On 12 May, a commission was set up to examine Eiffel's scheme and its rivals, which, a month later, decided that all the proposals except Eiffel's were either impractical or lacking in details.
                - superscript [ref=e484]:
                  - text: "["
                  - link "citation needed" [ref=e486] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Wikipedia:Citation_needed
                  - text: "]"
              - paragraph [ref=e487]:
                - text: After some debate about the exact location of the tower, a contract was signed on 8 January 1887. Eiffel signed it acting in his own capacity rather than as the representative of his company, the contract granting him 1.5 million
                - link "francs" [ref=e488] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/French_franc
                - text: "toward the construction costs: less than a quarter of the estimated 6.5 million francs. Eiffel was to receive all income from the commercial exploitation of the tower during the exhibition and for the next 20 years. He later established a separate company to manage the tower, putting up half the necessary capital himself."
                - superscript [ref=e489]:
                  - link "[12]" [ref=e490] [cursor=pointer]:
                    - /url: "#cite_note-12"
              - paragraph [ref=e492]:
                - text: A French bank, the
                - link "Crédit Industriel et Commercial" [ref=e494] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Crédit_Industriel_et_Commercial
                - text: (CIC), helped finance the construction of the Eiffel Tower. During the period of the tower's construction, the CIC was acquiring funds from
                - link "predatory loans" [ref=e495] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Predatory_lending
                - text: to the
                - link "National Bank of Haiti" [ref=e496] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/National_Bank_of_Haiti
                - text: ", some of which went towards the financing of the tower. These loans were connected to"
                - link "an indemnity controversy" [ref=e497] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Haiti_indemnity_controversy
                - text: that saw France force Haiti's government to financially compensate French slaveowners for lost income as a result of the
                - link "Haitian Revolution" [ref=e498] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Haitian_Revolution
                - text: ", and required Haiti to pay the CIC and its partner nearly half of all taxes collected on exports, \"effectively choking off the nation's primary source of income\". According to"
                - link "The New York Times" [ref=e500] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/The_New_York_Times
                - text: ", \"[at] a time when the [CIC] was helping finance one of the world's best-known landmarks, the Eiffel Tower, as a monument to French liberty, it was choking Haiti's economy, taking much of the young nation's income back to Paris and impairing its ability to start schools, hospitals and the other building blocks of an independent country.\""
                - superscript [ref=e501]:
                  - link "[13]" [ref=e502] [cursor=pointer]:
                    - /url: "#cite_note-:6-13"
            - region [ref=e504]:
              - heading "Artists' protest" [level=3] [ref=e506]
              - figure [ref=e507]:
                - link [ref=e508] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Caricature_Gustave_Eiffel.png
                - generic [ref=e510]:
                  - text: Caricature of Gustave Eiffel comparing the Eiffel tower to the
                  - link "Pyramids" [ref=e511] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Egyptian_pyramids
                  - text: ", published in"
                  - link "Le Temps" [ref=e513] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Le_Temps_(Paris)
                  - text: ", 14 February 1887"
              - paragraph [ref=e514]:
                - text: The proposed tower had been a subject of controversy, drawing criticism from those who did not believe it was feasible and those who objected on artistic grounds. Prior to the Eiffel Tower's construction, no structure had ever been constructed to a height of 300 m, or even 200 m for that matter,
                - superscript [ref=e515]:
                  - link "[14]" [ref=e516] [cursor=pointer]:
                    - /url: "#cite_note-14"
                - text: "and many people believed it was impossible. These objections were an expression of a long-standing debate in France about the relationship between architecture and engineering. It came to a head as work began at the Champ de Mars: a \"Committee of Three Hundred\" (one member for each metre of the tower's height) was formed, led by the prominent architect"
                - link "Charles Garnier" [ref=e518] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Charles_Garnier_(architect)
                - text: and including some of the most important figures of the arts, such as
                - link "William-Adolphe Bouguereau" [ref=e519] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/William-Adolphe_Bouguereau
                - text: ","
                - link "Guy de Maupassant" [ref=e520] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Guy_de_Maupassant
                - text: ","
                - link "Charles Gounod" [ref=e521] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Charles_Gounod
                - text: and
                - link "Jules Massenet" [ref=e522] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Jules_Massenet
                - text: . A petition called "Artists against the Eiffel Tower" was sent to the Minister of Works and Commissioner for the Exposition,
                - link "Adolphe Alphand" [ref=e523] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Adolphe_Alphand
                - text: ", and it was published by"
                - link "Le Temps" [ref=e525] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Le_Temps_(Paris)
                - text: "on 14 February 1887:"
              - blockquote [ref=e526]:
                - paragraph [ref=e527]:
                  - text: We, writers, painters, sculptors, architects and passionate devotees of the hitherto untouched beauty of Paris, protest with all our strength, with all our indignation in the name of slighted French taste, against the erection... of this useless and monstrous Eiffel Tower... To bring our arguments home, imagine for a moment a giddy, ridiculous tower dominating Paris like a gigantic black smokestack, crushing under its barbaric bulk Notre Dame, the Tour Saint-Jacques, the Louvre, the Dome of les Invalides, the Arc de Triomphe, all of our humiliated monuments will disappear in this ghastly dream. And for twenty years... we shall see stretching like a blot of ink the hateful shadow of the hateful column of bolted sheet metal.
                  - superscript [ref=e531]:
                    - link "[15]" [ref=e532] [cursor=pointer]:
                      - /url: "#cite_note-15"
                  - superscript [ref=e534]:
                    - link "[16]" [ref=e535] [cursor=pointer]:
                      - /url: "#cite_note-16"
              - 'figure "A 1918 calligram by Guillaume Apollinaire: Salut monde dont je suis la langue éloquente que sa bouche Ô Paris tire et tirera toujours aux allemands (\"Hello world, of which I am the eloquent tongue which your mouth, O Paris, will forever stick out at the Germans\")." [ref=e537]':
                - link [ref=e538] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Guillaume_Apollinaire_Calligramme.JPG
                - generic [ref=e540]:
                  - text: A 1918
                  - link "calligram" [ref=e541] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Calligram
                  - text: by
                  - link "Guillaume Apollinaire" [ref=e542] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Guillaume_Apollinaire
                  - text: ":"
                  - generic "French-language text" [ref=e543]: Salut monde dont je suis la langue éloquente que sa bouche Ô Paris tire et tirera toujours aux allemands
                  - text: ("Hello world, of which I am the eloquent tongue which your mouth, O Paris, will forever stick out at the Germans").
              - paragraph [ref=e544]:
                - text: Gustave Eiffel responded to these criticisms by comparing his tower to the
                - link "Egyptian pyramids" [ref=e545] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Egyptian_pyramids
                - text: ": \"My tower will be the tallest edifice ever erected by man. Will it not also be grandiose in its way? And why would something admirable in Egypt become hideous and ridiculous in Paris?\""
                - superscript [ref=e546]:
                  - link "[17]" [ref=e547] [cursor=pointer]:
                    - /url: "#cite_note-Souriau-17"
                - text: These criticisms were also dealt with by Édouard Lockroy in a letter of support written to Alphand, sardonically saying,
                - superscript [ref=e549]:
                  - link "[18]" [ref=e550] [cursor=pointer]:
                    - /url: "#cite_note-18"
                - text: "\"Judging by the stately swell of the rhythms, the beauty of the metaphors, the elegance of its delicate and precise style, one can tell this protest is the result of collaboration of the most famous writers and poets of our time\", and he explained that the protest was irrelevant since the project had been decided upon months before, and construction on the tower was already under way."
              - paragraph [ref=e552]:
                - text: "Garnier was a member of the Tower Commission that had examined the various proposals, and had raised no objection. Eiffel pointed out to a journalist that it was premature to judge the effect of the tower solely on the basis of the drawings, that the Champ de Mars was distant enough from the monuments mentioned in the protest for there to be little risk of the tower overwhelming them, and putting the aesthetic argument for the tower: \"Do not the laws of natural forces always conform to the secret laws of harmony?\""
                - superscript [ref=e553]:
                  - link "[19]" [ref=e554] [cursor=pointer]:
                    - /url: "#cite_note-19"
              - paragraph [ref=e556]:
                - text: Some of the protesters changed their minds when the tower was built; others remained unconvinced.
                - superscript [ref=e557]:
                  - link "[20]" [ref=e558] [cursor=pointer]:
                    - /url: "#cite_note-times1_4_89-20"
                - link "Guy de Maupassant" [ref=e560] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Guy_de_Maupassant
                - text: supposedly ate lunch in the tower's restaurant every day because it was the one place in Paris where the tower was not visible.
                - superscript [ref=e561]:
                  - link "[21]" [ref=e562] [cursor=pointer]:
                    - /url: "#cite_note-Jonnes-21"
              - paragraph [ref=e564]:
                - text: By 1918, it had become a symbol of Paris and of France after Guillaume Apollinaire wrote a nationalist poem in the shape of the tower (a
                - link "calligram" [ref=e565] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Calligram
                - text: ) to express his feelings about the war against Germany.
                - superscript [ref=e566]:
                  - link "[22]" [ref=e567] [cursor=pointer]:
                    - /url: "#cite_note-Greet-22"
                - text: Today, it is widely considered to be a remarkable piece of
                - link "structural art" [ref=e569] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Structural_art
                - text: ", and is often featured in films and literature."
            - region [ref=e570]:
              - heading "Construction" [level=3] [ref=e572]
              - figure [ref=e573]:
                - link [ref=e574] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Les_fondations_de_la_Tour_Eiffel,_maçonneries.jpg
                - generic [ref=e576]:
                  - link "Foundations" [ref=e577] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Foundation_(engineering)
                  - text: of the Eiffel Tower, photographed in 1887
              - paragraph [ref=e578]:
                - text: Work on the foundations started on 28 January 1887.
                - superscript [ref=e579]:
                  - link "[23]" [ref=e580] [cursor=pointer]:
                    - /url: "#cite_note-origins-23"
                - text: Those for the east and south legs were straightforward, with each leg resting on four 2 m (6.6 ft) concrete slabs, one for each of the principal girders of each leg. The west and north legs, being closer to the river
                - link "Seine" [ref=e582] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Seine
                - text: ", were more complicated: each slab needed two"
                - link "piles" [ref=e583] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Deep_foundation
                - text: installed by using compressed-air
                - link "caissons" [ref=e584] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Caisson_(engineering)
                - text: 15 m (49 ft) long and 6 m (20 ft) in diameter driven to a depth of 22 m (72 ft)
                - superscript [ref=e585]:
                  - link "[24]" [ref=e586] [cursor=pointer]:
                    - /url: "#cite_note-24"
                - text: to support the concrete slabs, which were 6 m (20 ft) thick. Each of these slabs supported a block of
                - link "limestone" [ref=e588] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Limestone
                - text: with an inclined top to bear a supporting shoe for the ironwork.
              - paragraph [ref=e589]:
                - text: "Each shoe was anchored to the stonework by a pair of bolts 10 cm (4 in) in diameter and 7.5 m (25 ft) long. The foundations were completed on 30 June, and the erection of the ironwork began. The visible work on-site was complemented by the enormous amount of exacting preparatory work that took place behind the scenes: the drawing office produced 1,700 general drawings and 3,629 detailed drawings of the 18,038 different parts needed."
                - superscript [ref=e590]:
                  - link "[25]" [ref=e591] [cursor=pointer]:
                    - /url: "#cite_note-25"
                - text: "The task of drawing the components was complicated by the complex angles involved in the design and the degree of precision required: the position of rivet holes was specified to within 1 mm (0.04 in) and angles worked out to one"
                - link "second of arc" [ref=e593] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Arcsecond
                - text: .
                - superscript [ref=e594]:
                  - link "[26]" [ref=e595] [cursor=pointer]:
                    - /url: "#cite_note-26"
                - text: The finished components, some already riveted together into sub-assemblies, arrived on horse-drawn carts from a factory in the nearby Parisian suburb of
                - link "Levallois-Perret" [ref=e597] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Levallois-Perret
                - text: "and were first bolted together, with the bolts being replaced with rivets as construction progressed. No drilling or shaping was done on site: if any part did not fit, it was sent back to the factory for alteration. In all, 18,038 pieces were joined using 2.5 million rivets."
                - superscript [ref=e598]:
                  - link "[23]" [ref=e599] [cursor=pointer]:
                    - /url: "#cite_note-origins-23"
              - paragraph [ref=e601]:
                - text: At first, the legs were constructed as
                - link "cantilevers" [ref=e602] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Cantilever
                - text: ", but about halfway to the first level construction was paused to create a substantial timber"
                - link "scaffold" [ref=e603] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Scaffold
                - text: ". This renewed concerns about the structural integrity of the tower, and sensational headlines such as \"Eiffel Suicide!\" and \"Gustave Eiffel Has Gone Mad: He Has Been Confined in an Asylum\" appeared in the tabloid press."
                - superscript [ref=e604]:
                  - link "[27]" [ref=e605] [cursor=pointer]:
                    - /url: "#cite_note-27"
                - text: Multiple famous artists of that time,
                - link "Charles Garnier" [ref=e607] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Charles_Garnier_(architect)
                - text: and
                - link "Alexandre Dumas" [ref=e608] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Alexandre_Dumas_fils
                - text: ", thought poorly of the newly made tower. Charles Garnier thought it was a \"truly tragic street lamp\". Alexandre Dumas said that it was like \"Odius shadow of the odious column built of rivets and iron plates extending like a black blot\". There were multiple protests over the style and the reasoning of placing it in the middle of Paris."
                - superscript [ref=e609]:
                  - link "[28]" [ref=e610] [cursor=pointer]:
                    - /url: "#cite_note-28"
                - text: At this stage, a small "creeper"
                - link "crane" [ref=e612] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Crane_(machine)
                - text: designed to move up the tower was installed in each leg. They made use of the guides for the lifts which were to be fitted in the four legs. The critical stage of joining the legs at the first level was completed by the end of March 1888.
                - superscript [ref=e613]:
                  - link "[23]" [ref=e614] [cursor=pointer]:
                    - /url: "#cite_note-origins-23"
                - text: Although the metalwork had been prepared with the utmost attention to detail, provision had been made to carry out small adjustments to precisely align the legs;
                - link "hydraulic" [ref=e616] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Hydraulic
                - link "jacks" [ref=e617] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Jack_(device)
                - text: were fitted to the shoes at the base of each leg, capable of exerting a force of 800 tonnes, and the legs were intentionally constructed at a slightly steeper angle than necessary, being supported by
                - link "sandboxes" [ref=e618] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Sand_box_(civil_engineering)
                - text: on the scaffold. Although construction involved 300 on-site employees,
                - superscript [ref=e619]:
                  - link "[23]" [ref=e620] [cursor=pointer]:
                    - /url: "#cite_note-origins-23"
                - text: due to Eiffel's safety precautions and the use of movable gangways, guardrails and screens, only one person died.
                - superscript [ref=e622]:
                  - link "[29]" [ref=e623] [cursor=pointer]:
                    - /url: "#cite_note-29"
              - list [ref=e625]:
                - listitem [ref=e626]:
                  - link [ref=e629] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/File:Construction_tour_eiffel.JPG
                    - img "18 July 1887:The start of the erection of the metalwork" [ref=e630]
                  - generic [ref=e631]: 18 July 1887:The start of the erection of the metalwork
                - listitem [ref=e632]:
