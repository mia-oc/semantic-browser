          - region [ref=e1773]:
            - heading "Tourism" [level=2] [ref=e1775]
            - region [ref=e1776]:
              - heading "Transport" [level=3] [ref=e1778]
              - paragraph [ref=e1779]:
                - text: The nearest
                - link "Paris Metro" [ref=e1780] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Paris_Metro
                - text: station is
                - link "Bir-Hakeim" [ref=e1781] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Bir-Hakeim_station
                - text: and the nearest
                - link "RER" [ref=e1782] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Réseau_Express_Régional
                - text: station is
                - link "Champ de Mars-Tour Eiffel" [ref=e1783] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Champ_de_Mars–Tour_Eiffel_station
                - text: .
                - superscript [ref=e1784]:
                  - link "[110]" [ref=e1785] [cursor=pointer]:
                    - /url: "#cite_note-110"
                - text: The tower itself is located at the intersection of the quai Branly and the
                - link "Pont d'Iéna" [ref=e1787] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Pont_d'Iéna
                - text: .
            - region [ref=e1788]:
              - heading "Popularity" [level=3] [ref=e1790]
              - figure "Number of visitors per year between 1889 and 2004" [ref=e1791]:
                - link [ref=e1792] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Eiffel_Tower_Visitors.svg
              - paragraph [ref=e1795]:
                - text: More than 300 million people have visited the tower since it was completed in 1889.
                - superscript [ref=e1796]:
                  - link "[111]" [ref=e1797] [cursor=pointer]:
                    - /url: "#cite_note-111"
                - superscript [ref=e1799]:
                  - link "[5]" [ref=e1800] [cursor=pointer]:
                    - /url: "#cite_note-Key_figures-5"
                - text: In 2015, there were 6.91 million visitors.
                - superscript [ref=e1802]:
                  - link "[112]" [ref=e1803] [cursor=pointer]:
                    - /url: "#cite_note-112"
                - text: The tower is the most-visited paid monument in the world.
                - superscript [ref=e1805]:
                  - link "[7]" [ref=e1806] [cursor=pointer]:
                    - /url: "#cite_note-:0-7"
                - text: An average of 25,000 people ascend the tower every day (which can result in long queues).
                - superscript [ref=e1808]:
                  - link "[113]" [ref=e1809] [cursor=pointer]:
                    - /url: "#cite_note-113"
          - region [ref=e1811]:
            - heading "Illumination copyright" [level=2] [ref=e1813]
            - note [ref=e1814]:
              - text: "Further information:"
              - link "Freedom of panorama § France" [ref=e1815] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Freedom_of_panorama#France
            - figure "The Eiffel Tower illuminated in 2024" [ref=e1816]:
              - link [ref=e1817] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/File:1000_Eiffel_tower_night_illumination_by_Pierre_Bideau_in_Paris_Photo_by_Giles_Laurent.jpg
                - img "The Eiffel Tower illuminated in 2024" [ref=e1818]
            - paragraph [ref=e1820]:
              - text: The tower and its image have been in the
              - link "public domain" [ref=e1821] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Public_domain
              - text: since 1993, 70 years after Eiffel's death.
              - superscript [ref=e1822]:
                - link "[114]" [ref=e1823] [cursor=pointer]:
                  - /url: "#cite_note-114"
              - text: In June 1990, a French court ruled that a special lighting display on the tower in 1989 to mark the tower's 100th anniversary was an "original visual creation" protected by copyright. The
              - link "Court of Cassation" [ref=e1825] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Court_of_Cassation_(France)
              - text: ", France's judicial court of last resort, upheld the ruling in March 1992."
              - superscript [ref=e1826]:
                - link "[115]" [ref=e1827] [cursor=pointer]:
                  - /url: "#cite_note-115"
              - text: The
              - generic "French-language text" [ref=e1829]: Société d'Exploitation de la Tour Eiffel
              - text: (SETE) now considers any illumination of the tower to be a separate work of art that falls under copyright.
              - superscript [ref=e1830]:
                - link "[116]" [ref=e1831] [cursor=pointer]:
                  - /url: "#cite_note-116"
              - text: As a result, the SNTE alleges that it is illegal to publish contemporary photographs of the lit tower at night without permission in France and some other countries for commercial use.
              - superscript [ref=e1833]:
                - link "[117]" [ref=e1834] [cursor=pointer]:
                  - /url: "#cite_note-117"
              - superscript [ref=e1836]:
                - link "[118]" [ref=e1837] [cursor=pointer]:
                  - /url: "#cite_note-118"
              - text: For this reason, it is often rare to find images or videos of the lit tower at night on stock image sites,
              - superscript [ref=e1839]:
                - link "[119]" [ref=e1840] [cursor=pointer]:
                  - /url: "#cite_note-petapixeleiffel-119"
              - text: and media outlets rarely broadcast images or videos of it.
              - superscript [ref=e1842]:
                - link "[120]" [ref=e1843] [cursor=pointer]:
                  - /url: "#cite_note-thecultureeiffel-120"
            - paragraph [ref=e1845]:
              - text: The imposition of copyright has been controversial. The Director of Documentation for what was then called the
              - generic "French-language text" [ref=e1846]: Société Nouvelle d'exploitation de la Tour Eiffel
              - text: "(SNTE), Stéphane Dieu, commented in 2005: \"It is really just a way to manage commercial use of the image, so that it isn't used in ways [of which] we don't approve\"."
              - superscript [ref=e1847]:
                - link "[121]" [ref=e1848] [cursor=pointer]:
                  - /url: "#cite_note-fastco-121"
              - text: SNTE made over €1 million from copyright fees in 2002.
              - superscript [ref=e1850]:
                - link "[122]" [ref=e1851] [cursor=pointer]:
                  - /url: "#cite_note-122"
              - text: However, it could also be used to restrict the publication of tourist photographs of the tower at night, as well as hindering non-profit and semi-commercial publication of images of the illuminated tower.
              - superscript [ref=e1853]:
                - link "[123]" [ref=e1854] [cursor=pointer]:
                  - /url: "#cite_note-artjournal-123"
            - paragraph [ref=e1856]:
              - text: The copyright claim itself has never been tested in courts to date, according to a 2014 article in the Art Law Journal, and there has never been an attempt to track down millions of people who have posted and shared their images of the illuminated tower on the Internet worldwide. However, the article adds that commercial uses of such images, like in a magazine, on a film poster, or on product packaging, may require prior permission.
              - superscript [ref=e1857]:
                - link "[124]" [ref=e1858] [cursor=pointer]:
                  - /url: "#cite_note-124"
            - paragraph [ref=e1860]:
              - text: French doctrine and jurisprudence allows pictures incorporating a copyrighted work as long as their presence is incidental or accessory to the subject being represented,
              - superscript [ref=e1861]:
                - link "[125]" [ref=e1862] [cursor=pointer]:
                  - /url: "#cite_note-125"
              - text: a reasoning akin to the
              - link "de minimis" [ref=e1865] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/De_minimis
              - text: rule. Therefore, SETE may be unable to claim copyright on photographs of Paris which happen to include the lit tower.
            - paragraph [ref=e1866]:
              - text: The author of the 1989 lighting display, lighting director Pierre Bideau, died in 2021; this makes the said display under artistic copyright until 2092, 70 full years after the director's death.
              - superscript [ref=e1867]:
                - link "[126]" [ref=e1868] [cursor=pointer]:
                  - /url: "#cite_note-126"
          - region [ref=e1870]:
            - heading "Replicas" [level=2] [ref=e1872]
            - note [ref=e1873]:
              - text: "Main article:"
              - link "List of Eiffel Tower replicas" [ref=e1874] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/List_of_Eiffel_Tower_replicas
            - figure [ref=e1875]:
              - link [ref=e1876] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/File:Paris_hotel_(Las_Vegas)1.JPG
              - generic [ref=e1878]:
                - text: Replica at the
                - link "Paris Las Vegas" [ref=e1879] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Paris_Las_Vegas
                - text: Hotel, Nevada, United States
            - paragraph [ref=e1880]:
              - text: As one of the most famous landmarks in the world, the Eiffel Tower has been the inspiration for the creation of many replicas and similar towers. An early example is
              - link "Blackpool Tower" [ref=e1881] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Blackpool_Tower
              - text: in England. The mayor of Blackpool, Sir John Bickerstaffe, was so impressed on seeing the Eiffel Tower at the 1889 exposition that he commissioned a similar tower to be built in his town. It opened in 1894 and is 158.1 m (519 ft) tall.
              - superscript [ref=e1882]:
                - link "[127]" [ref=e1883] [cursor=pointer]:
                  - /url: "#cite_note-127"
              - link "Tokyo Tower" [ref=e1885] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Tokyo_Tower
              - text: in Japan, built as a communications tower in 1958, was also inspired by the Eiffel Tower.
              - superscript [ref=e1886]:
                - link "[128]" [ref=e1887] [cursor=pointer]:
                  - /url: "#cite_note-128"
              - text: Well known is the
              - link "Petřín Lookout Tower" [ref=e1889] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Petřín_Lookout_Tower
              - text: in
              - link "Prague" [ref=e1890] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Prague
              - text: too.
              - superscript [ref=e1891]:
                - link "[129]" [ref=e1892] [cursor=pointer]:
                  - /url: "#cite_note-129"
            - paragraph [ref=e1894]:
              - text: There are various scale models of the tower in the United States, including a half-scale version at the
              - link "Paris Las Vegas" [ref=e1895] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Paris_Las_Vegas
