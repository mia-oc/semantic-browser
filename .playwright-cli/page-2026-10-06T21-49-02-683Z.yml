          - region [ref=e1631]:
            - heading "Taller structures" [level=2] [ref=e1633]
            - paragraph [ref=e1634]:
              - text: The Eiffel Tower was the world's tallest structure when completed in 1889, a distinction it retained until 1929 when the
              - link "Chrysler Building" [ref=e1635] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Chrysler_Building
              - text: in New York City was topped out.
              - superscript [ref=e1636]:
                - link "[109]" [ref=e1637] [cursor=pointer]:
                  - /url: "#cite_note-109"
              - text: The tower also lost its standing as the world's tallest tower to the
              - link "Tokyo Tower" [ref=e1639] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Tokyo_Tower
              - text: in 1958 but retains its status as the tallest freestanding (non-guyed) structure in France.
