                    - img "26 December 1888:Construction of the upper stage" [ref=e660]
                  - generic [ref=e661]: 26 December 1888:Construction of the upper stage
                - listitem [ref=e662]:
                  - link [ref=e665] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/File:Construction_tour_eiffel7.JPG
                    - img "15 March 1889:Construction of the cupola" [ref=e666]
                  - generic [ref=e667]:
                    - text: 15 March 1889:Construction of the
                    - link "cupola" [ref=e668] [cursor=pointer]:
                      - /url: https://en.wikipedia.org/wiki/Cupola
            - region [ref=e669]:
              - heading "Inauguration and the 1889 exposition" [level=3] [ref=e671]
              - figure "View of the 1889 World's Fair" [ref=e672]:
                - link [ref=e673] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Exposition_Universelle_de_Paris_1889_-_Universitäts-_und_Landesbibliothek_Darmstadt.jpg
              - paragraph [ref=e676]:
                - text: The main structural work was completed at the end of March 1889 and, on 31 March, Eiffel celebrated by leading a group of government officials, accompanied by representatives of the press, to the top of the tower.
                - superscript [ref=e677]:
                  - link "[20]" [ref=e678] [cursor=pointer]:
                    - /url: "#cite_note-times1_4_89-20"
                - text: Because the lifts were not yet in operation, the ascent was made by foot, and took over an hour, with Eiffel stopping frequently to explain various features. Most of the party chose to stop at the lower levels, but a few, including the structural engineer, Émile Nouguier, the head of construction, Jean Compagnon, the President of the City Council, and reporters from
                - link "Le Figaro" [ref=e681] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Le_Figaro
                - text: and
                - link "Le Monde Illustré" [ref=e683] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Le_Monde_Illustré
                - text: ", completed the ascent. At 2:35 pm, Eiffel hoisted a large"
                - link "Tricolour" [ref=e684] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Flag_of_France
                - text: to the accompaniment of a 25-gun salute fired at the first level.
                - superscript [ref=e685]:
                  - link "[30]" [ref=e686] [cursor=pointer]:
                    - /url: "#cite_note-30"
              - paragraph [ref=e688]:
                - text: There was still work to be done, particularly on the lifts and facilities, and the tower was not opened to the public until nine days after the opening of the exposition on 6 May; even then, the lifts had not been completed. The tower was an instant success with the public, and nearly 30,000 visitors made the 1,710-step climb to the top before the lifts entered service on 26 May.
                - superscript [ref=e689]:
                  - link "[31]" [ref=e690] [cursor=pointer]:
                    - /url: "#cite_note-Exposition-31"
                - text: Tickets cost 2 francs for the first level, 3 for the second, and 5 for the top, with half-price admission on Sundays,
                - superscript [ref=e692]:
                  - link "[32]" [ref=e693] [cursor=pointer]:
                    - /url: "#cite_note-32"
                - text: and by the end of the exhibition there had been 1,896,987 visitors.
                - superscript [ref=e695]:
                  - link "[5]" [ref=e696] [cursor=pointer]:
                    - /url: "#cite_note-Key_figures-5"
              - paragraph [ref=e698]:
                - text: After dark, the tower was lit by hundreds of gas lamps, and a beacon sent out three beams of red, white and blue light. Two searchlights mounted on a circular rail were used to illuminate various buildings of the exposition. The daily opening and closing of the exposition were announced by a cannon at the top.
                - superscript [ref=e699]:
                  - link "[33]" [ref=e700] [cursor=pointer]:
                    - /url: "#cite_note-33"
              - figure [ref=e702]:
                - link [ref=e703] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Georges_Garen_embrasement_tour_Eiffel.jpg
                - generic [ref=e705]:
                  - text: Illumination of the tower at night during the exposition; painted by
                  - link "Georges Garen" [ref=e706] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Georges_Garen?action=edit&redlink=1
                  - generic [ref=e707]:
                    - text: "["
                    - link "fr" [ref=e708] [cursor=pointer]:
                      - /url: https://fr.wikipedia.org/wiki/Georges%20Garen
                    - text: "]"
                  - text: ", 1889"
              - paragraph [ref=e709]:
                - text: On the second level, the French newspaper Le Figaro had an office and a printing press, where a special souvenir edition, Le Figaro de la Tour, was made.
                - superscript [ref=e710]:
                  - link "[34]" [ref=e711] [cursor=pointer]:
                    - /url: "#cite_note-34"
              - paragraph [ref=e713]:
                - text: At the top, there was a post office where visitors could send letters and postcards as a memento of their visit.
                - link "Graffitists" [ref=e714] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Graffiti
                - text: "were also catered for: sheets of paper were mounted on the walls each day for visitors to record their impressions of the tower. Gustave Eiffel described the collection of responses as \"truly curious\"."
                - superscript [ref=e715]:
                  - link "[35]" [ref=e716] [cursor=pointer]:
                    - /url: "#cite_note-35"
              - paragraph [ref=e718]:
                - text: Famous visitors to the tower included the
                - link "Prince of Wales" [ref=e719] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Edward_VII
                - text: ","
                - link "Sarah Bernhardt" [ref=e720] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Sarah_Bernhardt
                - text: ","
                - link "\"Buffalo Bill\" Cody" [ref=e721] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/William_Cody
                - text: (his Wild West show was an attraction at the exposition) and
                - link "Thomas Edison" [ref=e722] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Thomas_Edison
                - text: .
                - superscript [ref=e723]:
                  - link "[31]" [ref=e724] [cursor=pointer]:
                    - /url: "#cite_note-Exposition-31"
                - text: Eiffel invited Edison to his private apartment at the top of the tower, where Edison presented him with one of his
                - link "phonographs" [ref=e726] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Phonograph
                - text: ", a new invention and one of the many highlights of the exposition."
                - superscript [ref=e727]:
                  - link "[36]" [ref=e728] [cursor=pointer]:
                    - /url: "#cite_note-36"
                - text: Edison signed the
                - link "guestbook" [ref=e730] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Guestbook
                - text: "with this message on September 10, 1889:"
              - blockquote [ref=e731]:
                - paragraph [ref=e732]: To M Eiffel the Engineer the brave builder of so gigantic and original specimen of modern Engineering from one who has the greatest respect and admiration for all Engineers including the Great Engineer the Bon Dieu, Thomas Edison.
              - paragraph [ref=e733]:
                - text: Eiffel made use of his apartment at the top of the tower to carry out
                - link "meteorological observations" [ref=e734] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Meteorology
                - text: ", and also used the tower to perform experiments on the action of air resistance on falling bodies."
                - superscript [ref=e735]:
                  - link "[37]" [ref=e736] [cursor=pointer]:
                    - /url: "#cite_note-37"
            - region [ref=e738]:
              - heading "Subsequent events" [level=3] [ref=e740]
              - figure [ref=e741]:
                - generic [ref=e743]:
                  - button "Play video" [ref=e745] [cursor=pointer]
                  - generic [ref=e747] [cursor=pointer]:
                    - generic [ref=e748]: "Duration: 43 seconds."
                    - text: 0:43
                - link:
                  - /url: https://en.wikipedia.org/wiki/File:Vue_Lumière_No_992_-_Panorama_pendant_l'ascension_de_la_Tour_Eiffel_(1898).ogv
                - generic [ref=e749]:
                  - text: Panoramic view during ascent of the Eiffel Tower by the
                  - link "Lumière brothers" [ref=e750] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Auguste_and_Louis_Lumière
                  - text: ", 1898"
              - paragraph [ref=e751]:
                - text: Originally commissioned as a temporary structure for the
                - link "1889 Exposition Universelle" [ref=e752] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Exposition_Universelle_(1889)
                - text: ", Eiffel was slated for dismantling in 1909, at which point ownership would have reverted to the"
                - link "City of Paris" [ref=e753] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Paris
                - text: . While the original design contest necessitated that the tower be easily disassembled, the structure was spared from scheduled demolition due to its demonstrated utility in early 20th-century scientific and technological advancements, specifically
                - link "radio telegraphy" [ref=e754] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Radio_telegraphy
                - text: . Following the expiration of the original concession, the tower was permitted to remain, subsequently becoming an integral part of the International Time Service in 1910.
                - superscript [ref=e755]:
                  - link "[38]" [ref=e756] [cursor=pointer]:
                    - /url: "#cite_note-38"
              - paragraph [ref=e758]:
                - text: For the
                - link "1900 Exposition Universelle" [ref=e759] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Exposition_Universelle_(1900)
                - text: ", the lifts in the east and west legs were replaced by lifts running as far as the second level constructed by the French firm Fives-Lille. These had a compensating mechanism to keep the floor level as the angle of ascent changed at the first level, and were driven by a similar hydraulic mechanism as the Otis lifts, although this was situated at the base of the tower. Hydraulic pressure was provided by pressurised accumulators located near this mechanism."
                - superscript [ref=e760]:
                  - link "[39]" [ref=e761] [cursor=pointer]:
                    - /url: "#cite_note-vogel_23-4-39"
                - text: At the same time the lift in the north pillar was removed and replaced by a staircase to the first level. The layout of both first and second levels was modified. The original lift in the south pillar was removed 13 years later.
                - superscript [ref=e763]:
                  - text: "["
                  - link "citation needed" [ref=e765] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Wikipedia:Citation_needed
                  - text: "]"
              - figure "Santos-Dumont No. 5; 13 July 1901" [ref=e766]:
                - link [ref=e767] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Santos-Dumont_flight_around_the_Eiffel_Tower.jpg
              - paragraph [ref=e770]:
                - text: On 19 October 1901,
                - link "Alberto Santos-Dumont" [ref=e771] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Alberto_Santos-Dumont
                - text: ", flying his"
                - link "No.6 airship" [ref=e772] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Santos-Dumont_number_6
                - text: ", won a 100,000-franc prize offered by"
                - link "Henri Deutsch de la Meurthe" [ref=e773] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Henri_Deutsch_de_la_Meurthe
                - text: for the first person to make a flight from
                - link "St. Cloud" [ref=e774] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Saint-Cloud
                - text: to the Eiffel Tower and back in less than half an hour.
                - superscript [ref=e775]:
                  - link "[40]" [ref=e776] [cursor=pointer]:
                    - /url: "#cite_note-40"
              - paragraph [ref=e778]:
                - text: From 1910, the
                - link "astronomical clocks" [ref=e779] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Astronomical_clock
                - text: of the
                - link "Paris Observatory" [ref=e780] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Paris_Observatory
                - text: sent the time to sea daily through the Eiffel Tower within a radius of 5 000 km.
                - superscript [ref=e781]:
                  - link "[41]" [ref=e782] [cursor=pointer]:
                    - /url: "#cite_note-:110-41"
                - text: The development of
                - link "wireless telegraphy" [ref=e784] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Wireless_telegraphy
                - text: allowed unifying
                - link "Universal Time" [ref=e785] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Universal_Time
                - text: .
                - superscript [ref=e786]:
                  - link "[41]" [ref=e787] [cursor=pointer]:
                    - /url: "#cite_note-:110-41"
                - text: On 9 March 1911, France adopted
                - link "Greenwich Mean Time" [ref=e789] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Greenwich_Mean_Time
                - text: by law. However, the law did not refer to
                - link "Greenwich Prime Meridian" [ref=e790] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Prime_meridian_(Greenwich)
                - text: ", but to the"
                - link "local mean time" [ref=e791] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Local_mean_time
                - text: of Paris delayed by 9
                - link "minutes" [ref=e792] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Minute
                - text: and 21
                - link "seconds" [ref=e793] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Second
                - text: .
                - superscript [ref=e794]:
                  - link "[42]" [ref=e795] [cursor=pointer]:
                    - /url: "#cite_note-42"
                - text: In 1912, following a report by
                - link "Gustave Ferrié" [ref=e797] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Gustave-Auguste_Ferrié
                - text: ", the"
                - link "Bureau des Longitudes" [ref=e798] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Bureau_des_Longitudes
                - text: organized at the Paris Observatory a Conférence internationale de l'heure radiotélégraphique (International Radiotelegraph Time Conference). The
                - link "International Time Bureau" [ref=e799] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/International_Time_Bureau
                - text: was created and installed in the premises of the Paris Observatory. However, due to
                - link "World War I" [ref=e800] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/World_War_I
                - text: ", the International Convention was never ratified."
                - superscript [ref=e801]:
                  - link "[43]" [ref=e802] [cursor=pointer]:
                    - /url: "#cite_note-:272-43"
                - text: In 1919, the existence of the International Time Bureau was formalized under the authority of an International Time Commission, under the aegis of the
                - link "International Astronomical Union" [ref=e804] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/International_Astronomical_Union
                - text: ", created by"
                - link "Benjamin Baillaud" [ref=e805] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Benjamin_Baillaud
                - text: .
                - superscript [ref=e806]:
                  - link "[41]" [ref=e807] [cursor=pointer]:
                    - /url: "#cite_note-:110-41"
              - paragraph [ref=e809]:
                - text: In 1910,
                - link "Father" [ref=e810] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Priest
                - link "Theodor Wulf" [ref=e811] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Theodor_Wulf
                - text: measured
                - link "radiant energy" [ref=e812] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Radiant_energy
                - text: at the top and bottom of the tower. He found more at the top than expected, incidentally discovering what are known today as
                - link "cosmic rays" [ref=e813] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Cosmic_ray
                - text: .
                - superscript [ref=e814]:
                  - link "[44]" [ref=e815] [cursor=pointer]:
                    - /url: "#cite_note-Wulf-44"
                - text: Two years later, on 4 February 1912, Austrian tailor
                - link "Franz Reichelt" [ref=e817] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Franz_Reichelt
                - text: died after jumping from the first level of the tower (a height of 57 m) to demonstrate his
                - link "parachute" [ref=e818] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Parachute
                - text: design.
                - superscript [ref=e819]:
                  - link "[45]" [ref=e820] [cursor=pointer]:
                    - /url: "#cite_note-45"
                - text: In 1914, at the outbreak of
                - link "World War I" [ref=e822] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/World_War_I
                - text: ", a radio transmitter located in the tower"
                - link "jammed" [ref=e823] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Radio_jamming
                - text: German radio communications, seriously hindering their advance on Paris and contributing to the Allied victory at the
                - link "First Battle of the Marne" [ref=e824] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/First_Battle_of_the_Marne
                - text: .
                - superscript [ref=e825]:
                  - link "[46]" [ref=e826] [cursor=pointer]:
                    - /url: "#cite_note-Tuchman1994-46"
              - paragraph [ref=e828]:
                - text: During
                - link "World War I" [ref=e829] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/World_War_I
                - text: ", the Eiffel Tower's wireless station played a crucial role in intercepting enemy communications from Berlin. In 1914, French forces successfully launched a counter-attack during the Battle of the Marne after gaining critical intelligence on the German Army's movements. In 1917, the station intercepted a coded message between Germany and Spain that referenced 'Operative H-21.' This information contributed to the arrest, conviction, and execution of"
                - link "Mata Hari" [ref=e830] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Mata_Hari
                - text: ", the famous dancer accused of working for Germany as a spy."
                - superscript [ref=e831]:
                  - link "[47]" [ref=e832] [cursor=pointer]:
                    - /url: "#cite_note-47"
              - paragraph [ref=e834]:
                - text: From 1925 to 1934, illuminated signs for
                - link "Citroën" [ref=e835] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Citroën
                - text: adorned three of the tower's sides, making it the tallest advertising space in the world at the time.
                - superscript [ref=e836]:
                  - link "[48]" [ref=e837] [cursor=pointer]:
                    - /url: "#cite_note-48"
                - text: In April 1935, the tower was used to make experimental low-resolution television transmissions, using a
                - link "shortwave" [ref=e839] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Shortwave
                - text: transmitter of 200 watts power. On 17 November, an improved 180-line transmitter was installed.
                - superscript [ref=e840]:
                  - link "[49]" [ref=e841] [cursor=pointer]:
                    - /url: "#cite_note-Herbert2004-49"
              - figure [ref=e843]:
                - link [ref=e844] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Delaunay_-_Tour_Eiffel.jpeg
                - generic [ref=e846]:
                  - text: The Eiffel Tower has been a subject of art, as in
                  - 'link "Champs de Mars: The Red Tower" [ref=e848] [cursor=pointer]':
                    - /url: https://en.wikipedia.org/wiki/Champs_de_Mars:_The_Red_Tower
                  - text: ", a 1911"
                  - link "cubist" [ref=e849] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Cubism
                  - text: painting by
                  - link "Robert Delaunay" [ref=e850] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Robert_Delaunay
                  - text: .
              - paragraph [ref=e851]:
                - text: On two separate but related occasions in 1925, the con artist
                - link "Victor Lustig" [ref=e852] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Victor_Lustig
                - text: "\"sold\" the tower for scrap metal."
                - superscript [ref=e853]:
                  - link "[50]" [ref=e854] [cursor=pointer]:
                    - /url: "#cite_note-Letcher2003-50"
                - text: A year later, in February 1926, pilot Leon Collet was killed trying to fly under the tower. His aircraft became entangled in an aerial belonging to a wireless station.
                - superscript [ref=e856]:
                  - link "[51]" [ref=e857] [cursor=pointer]:
                    - /url: "#cite_note-51"
                - text: A
                - link "bust" [ref=e859] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Bust_(sculpture)
                - text: of Gustave Eiffel by
                - link "Antoine Bourdelle" [ref=e860] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Antoine_Bourdelle
                - text: was unveiled at the base of the north leg on 2 May 1929.
                - superscript [ref=e861]:
                  - link "[52]" [ref=e862] [cursor=pointer]:
                    - /url: "#cite_note-52"
                - text: In 1930, the tower lost the title of the
                - link "world's tallest structure" [ref=e864] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/List_of_tallest_freestanding_structures_in_the_world#Timeline_of_world's_tallest_freestanding_structures
                - text: when the
                - link "Chrysler Building" [ref=e865] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Chrysler_Building
                - text: in New York City was completed.
                - superscript [ref=e866]:
                  - link "[53]" [ref=e867] [cursor=pointer]:
                    - /url: "#cite_note-53"
                - text: In 1938, the decorative arcade around the first level was removed.
                - superscript [ref=e869]:
                  - link "[54]" [ref=e870] [cursor=pointer]:
                    - /url: "#cite_note-54"
              - paragraph [ref=e872]:
                - text: Upon the
                - link "German occupation" [ref=e873] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Military_Administration_in_France_(Nazi_Germany)
                - text: of Paris in 1940, the lift cables were
                - link "cut" [ref=e874] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Sabotage
                - text: by the French. The tower was restricted to German visitors during the occupation and the lifts were not repaired until 1946.
                - superscript [ref=e875]:
                  - link "[55]" [ref=e876] [cursor=pointer]:
                    - /url: "#cite_note-Harriss_80_4-55"
                - text: In 1940, German soldiers had to climb the tower to hoist a swastika-centred
                - link "Reichskriegsflagge" [ref=e878] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Reichskriegsflagge
                - text: ","
                - superscript [ref=e879]:
                  - link "[56]" [ref=e880] [cursor=pointer]:
                    - /url: "#cite_note-56"
                - text: but the flag was so large it blew away just a few hours later, and was replaced by a smaller one.
                - superscript [ref=e882]:
                  - link "[57]" [ref=e883] [cursor=pointer]:
                    - /url: "#cite_note-57"
                - text: When visiting Paris, Hitler chose to stay on the ground. When the
                - link "Allies" [ref=e885] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Allies_of_World_War_II
                - text: were nearing Paris in August 1944, Hitler ordered General
                - link "Dietrich von Choltitz" [ref=e886] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Dietrich_von_Choltitz
                - text: ", the military governor of Paris, to demolish the tower along with the rest of the city. Von Choltitz disobeyed the order."
                - superscript [ref=e887]:
                  - link "[58]" [ref=e888] [cursor=pointer]:
                    - /url: "#cite_note-D'Este2003-58"
                - text: On 25 August, before the Germans had been
                - link "driven out of Paris" [ref=e890] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Liberation_of_Paris
                - text: ", the German flag was replaced with a Tricolour by two men from the"
                - link "French Naval Museum" [ref=e891] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Musée_national_de_la_Marine
                - text: ", who narrowly beat three men led by Lucien Sarniguet, who had lowered the Tricolour on 13 June 1940 when Paris fell to the Germans."
                - superscript [ref=e892]:
                  - link "[55]" [ref=e893] [cursor=pointer]:
                    - /url: "#cite_note-Harriss_80_4-55"
              - paragraph [ref=e895]:
                - text: A fire started in the television transmitter on 3 January 1956, damaging the top of the tower. Repairs took a year, and in 1957, the present radio aerial was added to the top.
                - superscript [ref=e896]:
                  - link "[59]" [ref=e897] [cursor=pointer]:
                    - /url: "#cite_note-events-59"
                - text: In 1964, the Eiffel Tower was officially declared to be a historical monument by the Minister of Cultural Affairs,
                - link "André Malraux" [ref=e899] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/André_Malraux
                - text: .
                - superscript [ref=e900]:
                  - link "[60]" [ref=e901] [cursor=pointer]:
                    - /url: "#cite_note-60"
                - text: A year later, an additional lift system was installed in the north pillar.
                - superscript [ref=e903]:
                  - link "[61]" [ref=e904] [cursor=pointer]:
                    - /url: "#cite_note-official-website-lifts-61"
              - paragraph [ref=e906]:
                - text: According to interviews, in 1967,
                - link "Montreal" [ref=e907] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Montreal
                - text: Mayor
                - link "Jean Drapeau" [ref=e908] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Jean_Drapeau
                - text: negotiated a secret agreement with
                - link "Charles de Gaulle" [ref=e909] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Charles_de_Gaulle
                - text: for the tower to be dismantled and temporarily relocated to Montreal to serve as a landmark and tourist attraction during
                - link "Expo 67" [ref=e910] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Expo_67
                - text: . The plan was allegedly vetoed by the company operating the tower out of fear that the French government could refuse permission for the tower to be restored in its original location.
                - superscript [ref=e911]:
                  - link "[62]" [ref=e912] [cursor=pointer]:
                    - /url: "#cite_note-62"
              - paragraph [ref=e914]:
                - text: In 1982, the original lifts between the second and third levels were replaced after 97 years in service. These had been closed to the public between November and March because the water in the hydraulic drive tended to freeze. The new cars operate in pairs, with one counterbalancing the other, and perform the journey in one stage, reducing the journey time from eight minutes to less than two minutes. At the same time, two new emergency staircases were installed, replacing the original spiral staircases. In 1983, the south pillar was fitted with an electrically driven Otis lift to serve the
                - link "Jules Verne" [ref=e915] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Le_Jules_Verne
                - text: restaurant.
                - superscript [ref=e916]:
                  - link "[63]" [ref=e917] [cursor=pointer]:
                    - /url: "#cite_note-63"
                - text: The Fives-Lille lifts in the east and west legs, fitted in 1899, were extensively refurbished in 1986. The cars were replaced, and a computer system was installed to completely automate the lifts. The
                - link "motive power" [ref=e919] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Power_(physics)
                - text: was moved from the water hydraulic system to a new electrically driven oil-filled hydraulic system, and the original water hydraulics were retained solely as a counterbalance system.
                - superscript [ref=e920]:
                  - link "[61]" [ref=e921] [cursor=pointer]:
                    - /url: "#cite_note-official-website-lifts-61"
                - text: A service lift was added to the south pillar for moving small loads and maintenance personnel three years later.
                - superscript [ref=e923]:
                  - link "[64]" [ref=e924] [cursor=pointer]:
                    - /url: "#cite_note-64"
              - paragraph [ref=e926]:
                - link "Robert Moriarty" [ref=e927] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Robert_Moriarty
                - text: flew a
                - link "Beechcraft Bonanza" [ref=e928] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Beechcraft_Bonanza
                - text: under the tower on 31 March 1984.
                - superscript [ref=e929]:
                  - link "[65]" [ref=e930] [cursor=pointer]:
                    - /url: "#cite_note-65"
                - text: In 1987,
                - link "A. J. Hackett" [ref=e932] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/A._J._Hackett
                - text: made one of his first
                - link "bungee jumps" [ref=e933] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Bungee_jumping
                - text: from the top of the Eiffel Tower, using a special cord he had helped develop. Hackett was arrested by the police.
                - superscript [ref=e934]:
                  - link "[66]" [ref=e935] [cursor=pointer]:
                    - /url: "#cite_note-66"
                - text: On 27 October 1991, Thierry Devaux, along with mountain guide Hervé Calvayrac, performed a series of acrobatic figures while bungee jumping from the second floor of the tower. Facing the Champ de Mars, Devaux used an electric winch between figures to go back up to the second floor. When firemen arrived, he stopped after the sixth jump.
                - superscript [ref=e937]:
                  - link "[67]" [ref=e938] [cursor=pointer]:
                    - /url: "#cite_note-67"
              - figure [ref=e940]:
                - link [ref=e941] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:2013_Fireworks_on_Eiffel_Tower_11.jpg
                - generic [ref=e943]:
                  - text: The tower is a focal point for New Year's Eve and
                  - link "Bastille Day" [ref=e944] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Bastille_Day
                  - text: celebrations.
              - paragraph [ref=e945]:
                - text: For its "Countdown to the Year 2000" celebration on 31 December 1999, flashing lights and high-powered
                - link "searchlights" [ref=e946] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Searchlight
                - text: were installed on the tower. During the last three minutes of the year, the lights were turned on starting from the base of the tower and continuing to the top to welcome 2000 with a huge fireworks show. An exhibition above a cafeteria on the first floor commemorates this event. The searchlights on top of the tower made it a beacon in Paris's night sky, and 20,000 flashing bulbs gave the tower a sparkly appearance for five minutes every hour on the hour.
                - superscript [ref=e947]:
                  - link "[68]" [ref=e948] [cursor=pointer]:
                    - /url: "#cite_note-68"
              - paragraph [ref=e950]:
                - text: The lights sparkled blue for several nights to herald the new millennium on 31 December 1999. The sparkly lighting continued for 18 months until July 2001. The sparkling lights were turned on again on 21 June 2003, and the display was planned to last for 10 years before they needed replacing.
                - superscript [ref=e951]:
                  - link "[69]" [ref=e952] [cursor=pointer]:
                    - /url: "#cite_note-allyouneed-69"
              - paragraph [ref=e954]:
                - text: The tower received its 200,000,000th guest on 28 November 2002.
                - superscript [ref=e955]:
                  - link "[70]" [ref=e956] [cursor=pointer]:
                    - /url: "#cite_note-70"
                - text: The tower has operated at its maximum capacity of about 7 million visitors per year since 2003.
                - superscript [ref=e958]:
                  - link "[71]" [ref=e959] [cursor=pointer]:
                    - /url: "#cite_note-71"
                - text: In 2004, the Eiffel Tower began hosting a seasonal ice rink on the first level.
                - superscript [ref=e961]:
                  - link "[72]" [ref=e962] [cursor=pointer]:
                    - /url: "#cite_note-PorterPrince2006-72"
                - text: A
                - link "glass floor" [ref=e964] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Glass_floor
                - text: was installed on the first level during the 2014 refurbishment.
                - superscript [ref=e965]:
                  - link "[73]" [ref=e966] [cursor=pointer]:
                    - /url: "#cite_note-73"
          - region [ref=e968]:
            - heading "Design" [level=2] [ref=e970]
            - region [ref=e971]:
              - heading "Material" [level=3] [ref=e973]
              - figure "The Eiffel Tower from below" [ref=e974]:
                - link [ref=e975] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Sous_la_Tour_Eiffel_1.jpg
              - paragraph [ref=e978]:
                - text: The
                - link "puddle iron" [ref=e979] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Puddling_(metallurgy)
                - text: (wrought iron) of the Eiffel Tower weighs 7,300
                - link "tonnes" [ref=e980] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Tonne
                - text: ","
                - superscript [ref=e981]:
                  - link "[74]" [ref=e982] [cursor=pointer]:
                    - /url: "#cite_note-Hanser2006-74"
                - text: and the addition of lifts, shops and antennae have brought the total weight to approximately 10,100 tonnes.
                - superscript [ref=e984]:
                  - link "[75]" [ref=e985] [cursor=pointer]:
                    - /url: "#cite_note-75"
                - text: As a demonstration of the economy of design, if the 7,300 tonnes of metal in the structure were melted down, it would fill the square base, 125 metres (410 ft) on each side, to a depth of only 6.25 cm (2.46 in) assuming the density of the metal to be 7.8 tonnes per cubic metre.
                - superscript [ref=e987]:
                  - link "[76]" [ref=e988] [cursor=pointer]:
                    - /url: "#cite_note-76"
                - text: Additionally, a cubic box surrounding the tower (324 m × 125 m × 125 m) would contain 6,200 tonnes of air, weighing almost as much as the iron itself. Depending on the
                - link "ambient temperature" [ref=e990] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Room_temperature
                - text: ", the top of the tower may shift away from the sun by up to 18 cm (7 in) due to"
                - link "thermal expansion" [ref=e991] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Thermal_expansion
                - text: of the metal on the side facing the sun.
                - superscript [ref=e992]:
                  - link "[77]" [ref=e993] [cursor=pointer]:
                    - /url: "#cite_note-77"
            - region [ref=e995]:
              - heading "Wind and weather considerations" [level=3] [ref=e997]
              - figure "Lightning striking the Eiffel Tower in 1902" [ref=e998]:
                - link [ref=e999] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Lightning_striking_the_Eiffel_Tower_-_NOAA.jpg
              - paragraph [ref=e1002]:
                - text: When it was built, Eiffel was accused of trying to create something artistic with no regard to the principles of engineering. However, Eiffel and his team were experienced bridge builders. In an interview with the newspaper
                - link "Le Temps" [ref=e1004] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Le_Temps_(Paris)
                - text: "published on 14 February 1887, Eiffel said:"
              - blockquote [ref=e1005]:
                - paragraph [ref=e1006]:
                  - text: Is it not true that the very conditions which give strength also conform to the hidden rules of harmony?... Now to what phenomenon did I have to give primary concern in designing the Tower? It was wind resistance. Well then! I hold that the curvature of the monument's four outer edges, which is as mathematical calculation dictated it should be... will give a great impression of strength and beauty, for it will reveal to the eyes of the observer the boldness of the design as a whole.
                  - superscript [ref=e1009]:
                    - link "[78]" [ref=e1010] [cursor=pointer]:
                      - /url: "#cite_note-debate-78"
              - paragraph [ref=e1012]:
                - text: He used graphical methods to determine the strength of the tower and
                - link "empirical evidence" [ref=e1013] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Empirical_evidence
                - text: to account for the effects of wind, rather than a mathematical formula. Close examination of the tower reveals a basically
                - link "exponential" [ref=e1014] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Exponential_function
                - text: shape.
                - superscript [ref=e1015]:
                  - link "[79]" [ref=e1016] [cursor=pointer]:
                    - /url: "#cite_note-sciencedaily2005-79"
                - text: All parts of the tower were overdesigned to ensure maximum resistance to wind forces. The top half was assumed to have no gaps in the latticework.
                - superscript [ref=e1018]:
                  - link "[80]" [ref=e1019] [cursor=pointer]:
                    - /url: "#cite_note-80"
                - text: After it was completed, some have put forward various mathematical hypotheses in an attempt to explain the success of the design. A one devised in 2004 after letters sent by Eiffel to the French Society of Civil Engineers in 1885 were translated into English described it as a non-linear integral equation based on counteracting the wind pressure on any point of the tower with the tension between the construction elements at that point.
                - superscript [ref=e1021]:
                  - link "[79]" [ref=e1022] [cursor=pointer]:
                    - /url: "#cite_note-sciencedaily2005-79"
              - paragraph [ref=e1024]:
                - text: The Eiffel Tower sways by up to 9 cm (
                - generic [ref=e1025]:
                  - text: "3"
                  - generic [ref=e1026]: +
                  - text: 1⁄2
                - text: in) in the wind.
                - superscript [ref=e1027]:
                  - link "[81]" [ref=e1028] [cursor=pointer]:
                    - /url: "#cite_note-81"
            - region [ref=e1030]:
              - heading "Floors" [level=3] [ref=e1032]
              - region [ref=e1033]:
                - heading "Ground floor" [level=4] [ref=e1035]
                - figure "Base of the Eiffel Tower" [ref=e1036]:
                  - link [ref=e1037] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/File:Paris_Eiffel_092.JPG
                - paragraph [ref=e1040]:
                  - text: The four columns of the tower each house access stairs and lifts to the first two floors, while at the south column only the lift to the second floor restaurant is publicly accessible.
                  - superscript [ref=e1041]:
                    - text: "["
                    - link "clarification needed" [ref=e1043] [cursor=pointer]:
                      - /url: https://en.wikipedia.org/wiki/Wikipedia:Please_clarify
                    - text: "]"
              - region [ref=e1044]:
                - heading "1st floor" [level=4] [ref=e1046]
                - paragraph [ref=e1047]:
                  - text: The first floor is publicly accessible by lift or stairs. When originally built, the first level contained three restaurants—one French, one Russian and one
                  - link "Flemish" [ref=e1048] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Flemish_Region
                  - text: —and an "Anglo-American Bar". After the exposition closed, the Flemish restaurant was converted to a 250-seat theatre. Today there is the
                  - generic "French-language text" [ref=e1049]: Le 58 Tour Eiffel
                  - text: restaurant and other facilities.
                - figure "A promenade 2.6-metre (8 ft 6 in) wide ran around the outside of the first level" [ref=e1050]:
                  - link [ref=e1051] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/File:La_Tour_Eiffel_-_terrasse_de_la_première_plate-forme.jpg
              - region [ref=e1054]:
                - heading "2nd floor" [level=4] [ref=e1056]
                - paragraph [ref=e1057]:
                  - text: The second floor is publicly accessible by lift or stairs and has a restaurant called
                  - generic "French-language text" [ref=e1058]:
                    - link "Le Jules Verne" [ref=e1060] [cursor=pointer]:
                      - /url: https://en.wikipedia.org/wiki/Le_Jules_Verne
                  - text: ", a"
                  - link "gourmet" [ref=e1061] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Gourmet
                  - text: restaurant with its own lift going up from the south column to the second level. This restaurant has one star in the
                  - link "Michelin Red Guide" [ref=e1062] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Michelin_Guide
                  - text: . It was run by the multi-
                  - link "Michelin star" [ref=e1063] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Michelin_star
                  - text: chef
                  - link "Alain Ducasse" [ref=e1064] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Alain_Ducasse
                  - text: from 2007 to 2017.
                  - superscript [ref=e1065]:
                    - link "[82]" [ref=e1066] [cursor=pointer]:
                      - /url: "#cite_note-82"
                  - text: As of May 2019, it is managed by three-star chef
                  - link "Frédéric Anton" [ref=e1068] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Frédéric_Anton
                  - text: .
                  - superscript [ref=e1069]:
                    - link "[83]" [ref=e1070] [cursor=pointer]:
                      - /url: "#cite_note-ParisDigest-83"
                  - text: It owes its name to the famous science-fiction writer
                  - link "Jules Verne" [ref=e1072] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Jules_Verne
                  - text: .
              - region [ref=e1073]:
                - heading "3rd floor" [level=4] [ref=e1075]
                - paragraph [ref=e1076]: The third floor is the top floor, publicly accessible by lift.
                - paragraph [ref=e1077]:
                  - text: Originally there were laboratories for various experiments, and a small apartment reserved for Gustave Eiffel to entertain guests, which is now open to the public, complete with period decorations and lifelike
                  - link "mannequins" [ref=e1078] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Mannequin
                  - text: of Eiffel and some of his notable guests.
                  - superscript [ref=e1079]:
                    - link "[84]" [ref=e1080] [cursor=pointer]:
                      - /url: "#cite_note-Morton-84"
                  - superscript [ref=e1082]:
                    - link "[85]" [ref=e1083] [cursor=pointer]:
                      - /url: "#cite_note-85"
                - figure "Gustave Eiffel's apartment at the third floor" [ref=e1085]:
                  - link [ref=e1086] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/File:Gustaves_Apartment_-_Eiffel_(3384390462).jpg
                - paragraph [ref=e1089]:
                  - text: From 1937 until 1981, there was a restaurant near the top of the tower. It was removed due to structural considerations; engineers had determined it was too heavy and was causing the tower to sag.
                  - superscript [ref=e1090]:
                    - link "[86]" [ref=e1091] [cursor=pointer]:
                      - /url: "#cite_note-86"
                  - text: This restaurant was sold to an American restaurateur and transported to New York and then New Orleans. It was rebuilt on the edge of
                  - link "New Orleans' Garden District" [ref=e1093] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Garden_District,_New_Orleans
                  - text: as a restaurant and later event hall.
                  - superscript [ref=e1094]:
                    - link "[87]" [ref=e1095] [cursor=pointer]:
                      - /url: "#cite_note-87"
                - paragraph [ref=e1097]:
                  - text: Today there is a champagne bar on the third floor of the Eiffel Tower.
                  - superscript [ref=e1098]:
                    - link "[88]" [ref=e1099] [cursor=pointer]:
                      - /url: "#cite_note-88"
            - region [ref=e1101]:
              - heading "Lifts" [level=3] [ref=e1103]
              - paragraph [ref=e1104]:
                - text: The arrangement of the lifts has been changed several times during the tower's history. Given the elasticity of the cables and the time taken to align the cars with the landings, each lift, in normal service, takes an average of 8 minutes and 50 seconds to do the round trip, spending an average of 1 minute and 15 seconds at each level. The average journey time between levels is 1 minute. The original hydraulic mechanism is on public display in a small museum at the base of the east and west legs. Because the mechanism requires frequent lubrication and maintenance, public access is often restricted. The rope mechanism of the north tower can be seen as visitors exit the lift.
                - superscript [ref=e1105]:
                  - text: "["
                  - link "citation needed" [ref=e1107] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Wikipedia:Citation_needed
                  - text: "]"
              - figure "The Roux, Combaluzier & Lepape lifts during construction" [ref=e1108]:
                - link [ref=e1109] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Tour_Eiffel_Ascenseur_Roux,_Combaluzier_et_Lepape.jpg
              - figure "A two-storey lift climbs one of the Eiffel Tower's legs in 1990. At lower left is a safety net for catching pieces of ironmongery that fall off the Tower." [ref=e1112]:
                - link [ref=e1113] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:EiffelLifts.jpg
              - paragraph [ref=e1116]:
                - text: Equipping the tower with adequate and safe passenger lifts was a major concern of the government commission overseeing the Exposition. Although some visitors could be expected to climb to the first level, or even the second, lifts had to be the main means of ascent.
                - superscript [ref=e1117]:
                  - link "[89]" [ref=e1118] [cursor=pointer]:
                    - /url: "#cite_note-vogel_20-89"
              - paragraph [ref=e1120]:
                - text: Constructing lifts to reach the first level was done by making the legs wide enough at the bottom and so nearly straight that they could contain a straight track. A contract was given to the French company Roux, Combaluzier & Lepape for two lifts to be fitted in the east and west legs.
                - superscript [ref=e1121]:
                  - link "[90]" [ref=e1122] [cursor=pointer]:
                    - /url: "#cite_note-vogel_28-90"
                - text: "Roux, Combaluzier & Lepape used a pair of endless chains with rigid, articulated links to which the car was attached. Lead weights on some links of the upper or return sections of the chains counterbalanced most of the car's weight. The car was pushed up from below, not pulled up from above: to prevent the chain buckling, it was enclosed in a conduit. At the bottom of the run, the chains passed around 3.9 m (12 ft 10 in) diameter"
                - link "sprockets" [ref=e1124] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Sprocket
                - text: . Smaller sprockets at the top guided the chains.
                - superscript [ref=e1125]:
                  - link "[90]" [ref=e1126] [cursor=pointer]:
                    - /url: "#cite_note-vogel_28-90"
              - figure "The Otis lifts originally fitted in the north and south legs." [ref=e1128]:
                - link [ref=e1129] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Eiffel-Otis_lift-poyet.jpg
              - paragraph [ref=e1132]:
                - text: Installing lifts to the second level was more of a challenge because a straight track was impossible. No French company wanted to undertake the work. The European branch of
                - link "Otis Brothers & Company" [ref=e1133] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Otis_Elevator_Company
                - text: "submitted a proposal, but this was rejected: the fair's charter ruled out the use of any foreign material in the construction of the tower. The deadline for bids was extended, but still no French companies put themselves forward, and eventually the contract was given to Otis in July 1887."
                - superscript [ref=e1134]:
                  - link "[39]" [ref=e1135] [cursor=pointer]:
                    - /url: "#cite_note-vogel_23-4-39"
                - text: Otis were confident they would eventually be given the contract and had already started creating designs.
                - superscript [ref=e1137]:
                  - link "[91]" [ref=e1138] [cursor=pointer]:
                    - /url: "#cite_note-91"
              - paragraph [ref=e1140]:
                - text: The car was divided into two superimposed compartments, each holding 25 passengers, with the lift operator occupying an exterior platform on the first level.
                - link "Motive power" [ref=e1141] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Power_(physics)
                - text: "was provided by an inclined hydraulic ram 12.67 m (41 ft 7 in) long and 96.5 cm (38.0 in) in diameter in the tower leg with a stroke of 10.83 m (35 ft 6 in): this moved a carriage carrying six sheaves. Five fixed sheaves were mounted higher up the leg, producing an arrangement similar to a"
                - link "block and tackle" [ref=e1142] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Block_and_tackle
                - text: but acting in reverse, multiplying the stroke of the piston rather than the force generated. The hydraulic pressure in the driving cylinder was produced by a large open reservoir on the second level. After being exhausted from the cylinder, the water was pumped back up to the reservoir by two pumps in the machinery room at the base of the south leg. This reservoir also provided power to the lifts to the first level.
                - superscript [ref=e1143]:
                  - link "[92]" [ref=e1144] [cursor=pointer]:
                    - /url: "#cite_note-92"
              - paragraph [ref=e1146]:
                - text: "The original lifts for the journey between the second and third levels were supplied by Léon Edoux. A pair of 81 m (266 ft) hydraulic rams were mounted on the second level, reaching nearly halfway up to the third level. One lift car was mounted on top of these rams: cables ran from the top of this car up to sheaves on the third level and back down to a second car. Each car travelled only half the distance between the second and third levels and passengers were required to change lifts halfway by means of a short gangway. The 10-ton cars each held 65 passengers."
                - superscript [ref=e1147]:
                  - link "[93]" [ref=e1148] [cursor=pointer]:
                    - /url: "#cite_note-93"
            - region [ref=e1150]:
              - heading "Engraved names" [level=3] [ref=e1152]
              - note [ref=e1153]:
                - text: "Main article:"
                - link "List of the 72 names on the Eiffel Tower" [ref=e1154] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/List_of_the_72_names_on_the_Eiffel_Tower
              - figure "Names engraved on the tower" [ref=e1155]:
                - link [ref=e1156] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Les_savants_de_la_Tour_Eiffel.jpg
              - paragraph [ref=e1159]:
                - text: Gustave Eiffel engraved on the building of the tower the names of 72 French scientists, engineers and mathematicians as a recognition of their contributions. Eiffel chose this "invocation of science" because of his concern over the artists' protest. At the beginning of the 20th century, the engravings were painted over, but they were restored in 1986–87 by the
                - generic "French-language text" [ref=e1160]: Société Nouvelle d'exploitation de la Tour Eiffel
                - text: ", a company operating the tower."
                - superscript [ref=e1161]:
                  - link "[94]" [ref=e1162] [cursor=pointer]:
                    - /url: "#cite_note-lab&names-94"
            - region [ref=e1164]:
              - heading "Aesthetics" [level=3] [ref=e1166]
              - figure "Some original architectural details" [ref=e1167]:
                - link [ref=e1168] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Eiffel_Tower_plans_21.jpg
              - paragraph [ref=e1171]:
                - text: "The tower is painted in three shades: lighter at the top, getting progressively darker towards the bottom to complement the Parisian sky."
                - superscript [ref=e1172]:
                  - link "[95]" [ref=e1173] [cursor=pointer]:
                    - /url: "#cite_note-paintingcolor-95"
                - text: It was originally reddish brown; this changed in 1968 to a bronze colour known as "Eiffel Tower Brown".
                - superscript [ref=e1175]:
                  - link "[96]" [ref=e1176] [cursor=pointer]:
                    - /url: "#cite_note-painting-96"
                - text: In 2010 the tower was re-painted yellow-brown.
                - superscript [ref=e1178]:
                  - link "[97]" [ref=e1179] [cursor=pointer]:
                    - /url: "#cite_note-97"
                - superscript [ref=e1181]:
                  - link "[98]" [ref=e1182] [cursor=pointer]:
                    - /url: "#cite_note-98"
                - superscript [ref=e1184]:
                  - link "[99]" [ref=e1185] [cursor=pointer]:
                    - /url: "#cite_note-99"
              - paragraph [ref=e1187]:
                - text: Following the 2024 Summer Olympics held in Paris, Mayor
                - link "Anne Hidalgo" [ref=e1188] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Anne_Hidalgo
                - text: proposed keeping the
                - link "Olympic rings" [ref=e1189] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Olympic_symbols
                - text: on the tower permanently. The rings, which measure 95 feet (29 m) wide and 43 feet (13 m) high, were initially installed for the Games and were scheduled for removal after the
                - link "Paralympics" [ref=e1190] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/2024_Summer_Paralympics
                - text: . Hidalgo's decision faced criticism from the Eiffel family and some residents concerned about altering the protected monument. The original 30-ton rings would be replaced with lighter versions for long-term display.
                - superscript [ref=e1191]:
                  - link "[100]" [ref=e1192] [cursor=pointer]:
                    - /url: "#cite_note-100"
              - paragraph [ref=e1194]:
                - text: The only non-structural elements are the four decorative grill-work arches, added in Sauvestre's sketches, which served to make the tower look more substantial and to make a more impressive entrance to the exposition.
                - superscript [ref=e1195]:
                  - link "[101]" [ref=e1196] [cursor=pointer]:
                    - /url: "#cite_note-101"
              - paragraph [ref=e1198]:
                - text: A pop-culture movie cliché is that the view from a Parisian window always includes the tower.
                - superscript [ref=e1199]:
                  - link "[102]" [ref=e1200] [cursor=pointer]:
                    - /url: "#cite_note-102"
                - text: In reality, since zoning restrictions limit the height of most buildings in Paris to seven storeys, only a small number of tall buildings have a clear view of the tower.
                - superscript [ref=e1202]:
                  - link "[103]" [ref=e1203] [cursor=pointer]:
                    - /url: "#cite_note-103"
              - figure [ref=e1205]:
                - button "Play video" [ref=e1209] [cursor=pointer]
                - link:
                  - /url: https://en.wikipedia.org/wiki/File:Eiffel_Tower_Drone_4k-Qx_c1X3zfEc-313-251.webm
                - generic [ref=e1211]:
                  - link "Bird's-eye view" [ref=e1212] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Bird's-eye_view
                  - text: of the Eiffel Tower
            - region [ref=e1213]:
              - heading "Maintenance" [level=3] [ref=e1215]
              - paragraph [ref=e1216]:
                - text: Maintenance of the tower includes applying 60 tons of paint every 7 years to prevent it from
                - link "rusting" [ref=e1217] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Rust
                - text: . The tower has been completely repainted at least 19 times since it was built, with the most recent being in 2010.
                - link "Lead paint" [ref=e1218] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Lead_paint
                - text: was still being used as recently as 2001 when the practice was stopped out of concern for the environment.
                - superscript [ref=e1219]:
                  - link "[69]" [ref=e1220] [cursor=pointer]:
                    - /url: "#cite_note-allyouneed-69"
                - superscript [ref=e1222]:
                  - link "[104]" [ref=e1223] [cursor=pointer]:
                    - /url: "#cite_note-104"
                - superscript [ref=e1225]:
                  - link "[105]" [ref=e1226] [cursor=pointer]:
                    - /url: "#cite_note-105"
          - region [ref=e1228]:
            - heading "Communications" [level=2] [ref=e1230]
            - figure "Top of the Eiffel Tower with antennas" [ref=e1231]:
              - link [ref=e1232] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/File:Tour_Eiffel_le_sommet_08-2015_(cropped).jpg
            - paragraph [ref=e1235]:
              - text: The tower has been used for making radio transmissions since the beginning of the 20th century. Until the 1950s, sets of aerial wires ran from the
              - link "cupola" [ref=e1236] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Cupola
              - text: to anchors on the
              - link "Avenue de Suffren" [ref=e1237] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Avenue_de_Suffren
              - text: and Champ de Mars. These were connected to
              - link "longwave" [ref=e1238] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Longwave
              - text: transmitters in small bunkers. In 1909, a permanent underground radio centre was built near the south pillar, which still exists today. On 20 November 1913, the
              - link "Paris Observatory" [ref=e1239] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Paris_Observatory
              - text: ", using the Eiffel Tower as an aerial, exchanged wireless signals with the"
              - link "United States Naval Observatory" [ref=e1240] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/United_States_Naval_Observatory
              - text: ", which used an aerial in"
              - link "Arlington County, Virginia" [ref=e1241] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Arlington_County,_Virginia
              - text: . The object of the transmissions was to measure the difference in longitude between Paris and Washington, D.C.
              - superscript [ref=e1242]:
                - link "[106]" [ref=e1243] [cursor=pointer]:
                  - /url: "#cite_note-106"
              - text: Today, radio and digital television signals are transmitted from the Eiffel Tower.
