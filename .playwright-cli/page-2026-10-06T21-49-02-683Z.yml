              - paragraph [ref=e1406]:
                - text: A television antenna was first installed on the tower in 1957, increasing its height by 18.7 m (61 ft). Work carried out in 2000 added a further 5.3 m (17 ft), giving a total height of 324 m (1,063 ft).
